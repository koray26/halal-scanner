name: halal_scanner
description: "Halal-Scanner: prüft Lebensmittel anhand von Barcode und Zutatenliste mit transparenten, testbaren Regeln."
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  mobile_scanner: ">=7.0.0 <8.0.0"
  google_mlkit_text_recognition: ">=0.15.0 <0.18.0"
  image_picker: ^1.1.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=5.0.0 <7.0.0"

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
