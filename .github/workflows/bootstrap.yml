# Einmalig: erzeugt die Android- und iOS-Projektordner mit dem offiziellen
# Flutter-Werkzeug und legt sie im Repository ab. Läuft nur, wenn die
# Ordner noch fehlen.
name: Plattformordner erzeugen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prüfen, ob Plattformordner fehlen
        id: check
        run: |
          if [ -d android ] && [ -d ios ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: subosito/flutter-action@v2
        if: steps.check.outputs.needed == 'true'
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: flutter create (nur fehlende Dateien)
        if: steps.check.outputs.needed == 'true'
        run: |
          flutter --version
          flutter create --platforms=android,ios --org io.github.koray26 --project-name halal_scanner --no-pub .
          git status --short

      - name: Ergebnis committen
        if: steps.check.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata
          git commit -m "Android- und iOS-Projektordner mit flutter create erzeugt"
          git push
